# Copy this file to config.toml (which is gitignored) and edit it:
#   cp config.example.toml config.toml

[location]
# Replace these placeholders with your own coordinates (decimal degrees).
# The script exits if either is missing.
lat = 0.0
lon = 0.0

[comfort]
# All temperatures are in °F. Any key left out here falls back to the
# default shown.

# Below this outdoor temperature: close windows, run the heat.
cold = 55
# Lowest outdoor temperature for opening the windows a little (a crack). Between
# this and open_min, if it's dry enough, the advice is to open them a little.
crack_min = 55
# Lowest outdoor temperature for opening the windows.
open_min = 60
# Highest outdoor temperature for opening the windows; above it, use fans.
open_max = 75
# Above this outdoor temperature: close windows, run the AC.
hot = 82

# Dew point must be below this to open the windows (dry enough).
dry_dew = 60
# Above this dew point it's muggy: close windows, run the AC.
muggy_dew = 65

# How many hours of the hourly forecast to scan for upcoming changes.
lookahead_hours = 12

# Minimum hours between pushes. A change that happens sooner waits; if things flip back
# before the cooldown ends, nothing is sent, and otherwise the then-current state goes out.
push_cooldown_hours = 3

# Quiet hours: pushes that come due between these local hours (0-23) wait until the
# end. Set both or neither; the window may wrap past midnight. If things flip back
# before the quiet hours end, nothing is sent; otherwise the then-current state goes
# out when they end. Left off unless you uncomment these.
# quiet_start = 22
# quiet_end = 6

[clothing]
# What to wear, judged on the "feels like" temperature (°F), which includes wind
# chill and humidity. Any key left out here falls back to the default shown.

# Below this feels-like temperature it's way too cold: stay in if you can.
too_cold = 0
# Below this: pants, coat, hat, gloves.
hat_gloves_below = 35
# Below this: pants, coat.
coat_below = 45
# Below this: pants, sweater. At or above it: pants, t-shirt.
sweater_below = 60
# At or above this: shorts, t-shirt.
shorts_min = 75

# If feels-like swings by at least this many degrees within the lookahead,
# suggest layering.
layer_swing = 20

# Chance of rain (%) at or above which the peak hour in the next soon_hours calls
# for a rain jacket.
rain_chance = 50

# UV index at or above which the peak hour in the next soon_hours calls for sunscreen.
uv_min = 3

# Rain and sunscreen only count within this many hours (the current hour plus the
# next ones), so a forecast far off doesn't flag them or send a push early.
soon_hours = 3
